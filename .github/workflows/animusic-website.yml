# Publishes website/ (the AniMusic download page) to GitHub Pages:
# https://anikesh0001.github.io/AniMusic/
#
# Static files only: no build step. The page reads the latest release from the
# GitHub API in the visitor's browser, so a new release needs no redeploy.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: AniMusic website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
